// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Media3 and older AndroidX artifacts still declare the pre-1.8 Kotlin
    // stdlib split modules, whose classes are now inside kotlin-stdlib. Apply
    // the alignment to every module (Capacitor's plugin modules resolve their
    // own test classpaths) so the test APK does not fail on duplicate classes.
    configurations.configureEach {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
