name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (unit tests + Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser E2E (Now Playing flow)
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright is a test-only tool, deliberately not a project dependency.
      - name: Install Playwright (pinned, not saved to package.json)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Serve production build
        run: |
          npx vite preview --port 4173 > preview.log 2>&1 &
          npx --yes wait-on@8 -t 30000 http://localhost:4173/
      - run: node tests/e2e/now-playing.mjs
      - run: node tests/e2e/native-playback.mjs

  android:
    name: Android (Full variant, tests, APK inspection)
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.31.6 ndk;29.0.13113456'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply pinned InterTune compatibility fixes
        run: python3 scripts/prepare-intertune.py
      - name: Resolve prebuilt FFmpeg libraries for the Full variant
        run: git clone --depth 1 --branch audio https://github.com/mikooomich/ffmpeg-android-maker-prebuilt.git android/ffMetadataEx/ffmpeg-android-maker
      - name: Host unit tests
        working-directory: android
        run: ./gradlew :app:testFullDebugUnitTest
      - name: Build InterTune Full debug APK
        working-directory: android
        run: ./gradlew :app:assembleFullDebug
      - name: Compile instrumentation tests (no emulator on the runner)
        working-directory: android
        run: ./gradlew :app:assembleFullDebugAndroidTest
      - name: Inspect the built APK (package, version, permissions)
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK" && test -f "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep -E "^(package|uses-permission|sdkVersion|targetSdkVersion)" || true
          echo "$BADGING" | grep -q "^package: name='dev.skye.intertune.debug'"
          echo "$BADGING" | grep -q "versionName='0.12.11'"
          echo "$BADGING" | grep -q "uses-permission: name='android.permission.INTERNET'"
          echo "$BADGING" | grep -q "uses-permission: name='android.permission.READ_MEDIA_AUDIO'"
          echo "Inspected Full variant: $APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intertune-full-debug-apk
          path: android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
