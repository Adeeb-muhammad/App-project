name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (unit tests + Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser E2E (Now Playing flow)
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright is a test-only tool, deliberately not a project dependency.
      - name: Install Playwright (pinned, not saved to package.json)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Serve production build
        run: |
          npx vite preview --port 4173 > preview.log 2>&1 &
          npx --yes wait-on@8 -t 30000 http://localhost:4173/
      - run: node tests/e2e/now-playing.mjs
      - run: node tests/e2e/native-playback.mjs

  android:
    name: Android (unit tests, debug APK, test-APK compile, APK inspection)
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Host unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Compile instrumentation tests (no emulator on the runner)
        working-directory: android
        run: ./gradlew assembleDebugAndroidTest
      - name: Inspect the built APK (package, version, permissions, backup)
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "aapt2: $AAPT2"
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep -E "^(package|uses-permission|sdkVersion|targetSdkVersion)" || true
          VERSION=$(node -p "require('./package.json').version")
          echo "$BADGING" | grep -q "^package: name='com.personal.cinematicmusic'"
          echo "$BADGING" | grep -q "versionName='${VERSION}'"
          # Media playback needs a foreground service, its mediaPlayback type,
          # notifications and a wake lock. Anything else (especially storage) is a failure.
          UNEXPECTED=$(echo "$BADGING" | grep "^uses-permission" \
            | grep -vE "(DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION|android.permission.FOREGROUND_SERVICE$|android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK|android.permission.POST_NOTIFICATIONS|android.permission.WAKE_LOCK)" || true)
          if [ -n "$UNEXPECTED" ]; then echo "Unexpected permissions:"; echo "$UNEXPECTED"; exit 1; fi
          TREE=$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK")
          echo "$TREE" | grep -E "allowBackup|dataExtractionRules|fullBackupContent" || true
          echo "$TREE" | grep -qE "allowBackup[^=]*=(false|\(type 0x12\)0x0)"
          echo "$TREE" | grep -q "dataExtractionRules"
          ! echo "$TREE" | grep -q "FileProvider"
