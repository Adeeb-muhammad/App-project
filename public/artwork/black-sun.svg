<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Abstract artwork: Black Sun">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="82%">
      <stop offset="0" stop-color="#221b08" />
      <stop offset="0.55" stop-color="#110e05" />
      <stop offset="1" stop-color="#060503" />
    </radialGradient>
    <linearGradient id="corona" x1="180" y1="180" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde047" />
      <stop offset="0.5" stop-color="#f97316" />
      <stop offset="1" stop-color="#eab308" stop-opacity="0.1" />
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.55" /></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />

  <g filter="url(#soft)">
    <circle cx="400" cy="400" r="210" fill="#f59e0b" opacity="0.3" />
    <circle cx="400" cy="400" r="270" fill="#f97316" opacity="0.12" />
  </g>

  <circle cx="400" cy="400" r="180" fill="none" stroke="url(#corona)" stroke-width="7" opacity="0.9" />
  <circle cx="400" cy="400" r="198" fill="none" stroke="#fde047" stroke-width="1" opacity="0.35" />
  <circle cx="400" cy="400" r="160" fill="none" stroke="#f97316" stroke-width="1" opacity="0.3" />

  <circle cx="400" cy="400" r="124" fill="#050402" />
  <circle cx="400" cy="400" r="124" fill="none" stroke="#fbbf24" stroke-opacity="0.35" />

  <g fill="#fde047">
    <circle cx="622" cy="262" r="2.2" opacity="0.8" />
    <circle cx="196" cy="566" r="1.8" opacity="0.5" />
    <circle cx="664" cy="512" r="1.4" opacity="0.4" />
    <circle cx="244" cy="238" r="1.4" opacity="0.4" />
  </g>

  <rect width="800" height="800" filter="url(#grain)" opacity="0.14" style="mix-blend-mode: overlay" />
</svg>
