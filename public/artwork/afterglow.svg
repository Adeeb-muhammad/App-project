<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Abstract artwork: Afterglow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#17100f" />
      <stop offset="0.42" stop-color="#3a1712" />
      <stop offset="0.66" stop-color="#7c2d12" />
      <stop offset="0.82" stop-color="#c2410c" />
      <stop offset="1" stop-color="#120806" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop stop-color="#fed7aa" />
      <stop offset="0.45" stop-color="#fb923c" />
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.5" /></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sky)" />

  <g filter="url(#soft)">
    <circle cx="400" cy="560" r="190" fill="url(#sun)" opacity="0.85" />
    <ellipse cx="200" cy="420" rx="240" ry="80" fill="#f43f5e" opacity="0.18" />
  </g>

  <circle cx="400" cy="560" r="96" fill="#fdba74" opacity="0.95" />
  <circle cx="400" cy="560" r="96" fill="none" stroke="#fff7ed" stroke-opacity="0.5" />

  <g stroke="#fcd34d" stroke-opacity="0.35" stroke-width="1">
    <path d="M0 560h304M496 560h304" />
    <path d="M0 604h352M448 604h352" stroke-opacity="0.18" />
    <path d="M0 648h400M400 648h400" stroke-opacity="0.1" />
  </g>

  <path d="M0 700h800" stroke="#1c0a06" stroke-width="2" opacity="0.7" />

  <rect width="800" height="800" filter="url(#grain)" opacity="0.15" style="mix-blend-mode: overlay" />
</svg>
