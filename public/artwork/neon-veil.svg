<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Abstract artwork: Neon Veil">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b0a18" />
      <stop offset="0.6" stop-color="#0a0914" />
      <stop offset="1" stop-color="#05040a" />
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#22d3ee" stop-opacity="0.05" />
      <stop offset="0.32" stop-color="#22d3ee" stop-opacity="0.75" />
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.95" />
      <stop offset="0.72" stop-color="#7c6bff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#7c6bff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.55" /></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />

  <g filter="url(#soft)">
    <ellipse cx="420" cy="340" rx="150" ry="260" fill="#7c6bff" opacity="0.4" />
    <ellipse cx="380" cy="470" rx="220" ry="80" fill="#22d3ee" opacity="0.14" />
  </g>

  <rect x="356" y="90" width="88" height="640" fill="url(#streak)" />
  <rect x="398" y="120" width="3" height="560" fill="#e9d5ff" opacity="0.85" />
  <rect x="406" y="180" width="1" height="420" fill="#cffafe" opacity="0.5" />

  <g stroke="#a78bfa" stroke-opacity="0.22" stroke-width="1">
    <path d="M120 640h560" />
    <path d="M96 672h608" stroke-opacity="0.12" />
    <path d="M150 604h500" stroke-opacity="0.15" />
  </g>

  <circle cx="586" cy="276" r="2.6" fill="#cffafe" opacity="0.85" />
  <circle cx="252" cy="228" r="2" fill="#e9d5ff" opacity="0.6" />

  <rect width="800" height="800" filter="url(#grain)" opacity="0.14" style="mix-blend-mode: overlay" />
</svg>
