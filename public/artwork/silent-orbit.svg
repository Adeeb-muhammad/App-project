<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Abstract artwork: Silent Orbit">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0" stop-color="#2a1436" />
      <stop offset="0.6" stop-color="#160d20" />
      <stop offset="1" stop-color="#08060c" />
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="75%">
      <stop stop-color="#fbcfe8" />
      <stop offset="0.45" stop-color="#f472b6" />
      <stop offset="1" stop-color="#7e22ce" stop-opacity="0.15" />
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.5" /></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />

  <g filter="url(#soft)">
    <circle cx="420" cy="380" r="170" fill="#a855f7" opacity="0.3" />
    <ellipse cx="240" cy="640" rx="220" ry="120" fill="#f472b6" opacity="0.16" />
  </g>

  <g fill="none" stroke="#f472b6" stroke-width="1.1" opacity="0.45">
    <ellipse cx="400" cy="400" rx="300" ry="120" transform="rotate(-24 400 400)" />
    <ellipse cx="400" cy="400" rx="240" ry="88" transform="rotate(-24 400 400)" stroke-width="0.9" opacity="0.8" />
    <ellipse cx="400" cy="400" rx="336" ry="150" transform="rotate(14 400 400)" stroke-width="0.9" opacity="0.45" />
    <ellipse cx="400" cy="400" rx="380" ry="180" transform="rotate(48 400 400)" stroke-width="0.7" opacity="0.25" />
  </g>

  <circle cx="400" cy="400" r="118" fill="url(#orb)" />
  <circle cx="400" cy="400" r="118" fill="none" stroke="#f9a8d4" stroke-opacity="0.5" />

  <circle cx="400" cy="400" r="3.5" fill="#f4f1f8" opacity="0.9" />
  <circle cx="612" cy="232" r="2.4" fill="#f9a8d4" opacity="0.8" />
  <circle cx="216" cy="618" r="2" fill="#e9d5ff" opacity="0.5" />

  <rect width="800" height="800" filter="url(#grain)" opacity="0.12" style="mix-blend-mode: overlay" />
</svg>
