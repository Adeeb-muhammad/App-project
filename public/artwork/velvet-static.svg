<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Abstract artwork: Velvet Static">
  <defs>
    <radialGradient id="bg" cx="62%" cy="24%" r="92%">
      <stop offset="0" stop-color="#2c1220" />
      <stop offset="0.55" stop-color="#1a0c14" />
      <stop offset="1" stop-color="#0a0509" />
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="52" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.6" /></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />

  <g filter="url(#soft)">
    <ellipse cx="300" cy="300" rx="230" ry="190" fill="#fb7185" opacity="0.45" />
    <ellipse cx="560" cy="520" rx="240" ry="200" fill="#f59e0b" opacity="0.28" />
  </g>

  <g stroke="#f4f1f8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 160h800M0 176h800M0 264h800M0 312h800M0 400h800M0 424h800M0 520h800M0 552h800M0 640h800M0 688h800" />
  </g>

  <circle cx="400" cy="392" r="150" fill="none" stroke="#fda4af" stroke-opacity="0.28" stroke-width="1" />
  <circle cx="400" cy="392" r="196" fill="none" stroke="#fcd34d" stroke-opacity="0.12" stroke-width="1" />

  <rect width="800" height="800" fill="url(#vignette)" />
  <rect width="800" height="800" filter="url(#grain)" opacity="0.16" style="mix-blend-mode: overlay" />
</svg>
