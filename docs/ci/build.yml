# prepare this branch had no `workflow` scope, so it could not be pushed there. Activate with:
#   mkdir -p .github/workflows && git mv docs/ci/build.yml .github/workflows/build.yml
# (then remove these four comment lines). It has never been executed by GitHub.
name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (unit tests + Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: Android (debug APK + test compilation)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Host unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Compile instrumentation tests (no emulator on the runner)
        working-directory: android
        run: ./gradlew assembleDebugAndroidTest
      - name: Check manifest policy (no INTERNET, backup off)
        run: |
          set -e
          M=android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          test -f "$M" || M=$(find android/app/build -name AndroidManifest.xml -path '*merged_manifests/debug*' | head -1)
          echo "Using $M"
          ! grep -q 'android.permission.INTERNET' "$M"
          grep -q 'android:allowBackup="false"' "$M"
